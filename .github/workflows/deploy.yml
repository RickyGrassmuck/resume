name: Resume

on: [push]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Validation doesn't render a PDF, so skip Puppeteer's browser download
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Validate resume.json
        run: npm run validate

  gist-sync:
    name: gist-sync
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy
        run: gh gist edit "$GIST_ID" --filename resume.json resume.json
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 0dd33c0fd3d2e3e60317f879624f0ef7
